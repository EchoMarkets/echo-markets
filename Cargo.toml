[package]
name = "echo-markets"
version = "0.1.0"
edition = "2021"
authors = ["Ivan Molto"]
description = "Decentralized prediction market on Bitcoin via Charms protocol"
license = "MIT"
repository = "https://github.com/EchoMarkets/echo-markets"  

[dependencies]
# Charms SDK
charms-sdk = { version = "0.10.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bincode = { version = "1.3" }

# Cryptography
sha2 = { version = "0.10.9" }
k256 = { version = "0.13", features = ["schnorr", "sha256"] }

[dev-dependencies]
# For testing
hex = "0.4"
proptest = "1.0"

[features]
default = []
# Enable for local testing without zkVM
mock-zkvm = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

# zkVM target configuration
[profile.release.build-override]
opt-level = 3

[package.metadata.charms]
# Charms-specific build configuration
app-name = "echo-markets"
version = "1"
