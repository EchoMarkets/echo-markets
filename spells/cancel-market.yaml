# =============================================================================
# CANCEL MARKET SPELL
# =============================================================================
# Creator cancels the market before resolution
# All tokens become redeemable 1:1 for collateral (Invalid outcome)
#
# Requirements:
# - Only creator can cancel (signature required in witness)
# - Market must NOT be already resolved
# - Creator signs: SHA256("CANCEL" || market_id)
#
# After cancellation:
# - Market status becomes Cancelled
# - Resolution outcome is set to Invalid
# - Users can redeem equal YES + NO tokens for refund
#
# Usage:
# 1. Generate Byte-Safe Signature
# Concatenate the string 'CANCEL' with the raw bytes of market_id
#   export msg_hash=$(echo -n "CANCEL" | xxd -p && echo -n "${market_id}" | xxd -r -p | sha256sum | cut -d' ' -f1)
# Sign the msg_hash with creator's private key (using your preferred CLI tool)
#   export creator_cancel_signature="<signature_hex>"
# 2. Financials
#   export cancel_timestamp=$(date +%s)
# Note: market_balance remains the same as old_market_balance
#   export creator_btc_change=$((creator_btc_input_val - 500))
# 3. Final Spell Execution
#   cat cancel-market.yaml | envsubst | charms spell check --app-bins=${app_bin}
# =============================================================================

version: 8

apps:
  $00: n/${market_id}/${app_vk}

public_inputs:
  $00:
    Cancel: {}

# Witness contains creator's signature (64 bytes)
private_inputs:
  $00: "${creator_cancel_signature}"

ins:
  # 1. The Market NFT to be cancelled
  - utxo_id: ${market_utxo_id}
    charms:
      $00:
        market_id: ${market_id}
        question_hash: ${question_hash}
        params:
          trading_deadline: ${trading_deadline}
          resolution_deadline: ${resolution_deadline}
          fee_bps: ${fee_bps}
          min_bet: ${min_bet}
        status: Active
        resolution: null
        yes_supply: ${yes_supply}
        no_supply: ${no_supply}
        max_supply: ${max_supply}
        fees: ${accumulated_fees}
        creator: ${creator_pubkey}

  # 2. Creator's BTC UTXO (To pay for transaction fees)
  - utxo_id: ${creator_btc_utxo}
    charms: {}

outs:
  # 1. Updated Market NFT: Now in Cancelled status
  - address: ${addr_market}
    value: ${market_balance}
    charms:
      $00:
        market_id: ${market_id}
        question_hash: ${question_hash}
        params:
          trading_deadline: ${trading_deadline}
          resolution_deadline: ${resolution_deadline}
          fee_bps: ${fee_bps}
          min_bet: ${min_bet}
        status: Cancelled
        resolution:
          outcome: Invalid
          proof:
            SignedAttestation:
              resolver_pubkey: ${creator_pubkey}
              signature: ${creator_cancel_signature}
          timestamp: ${cancel_timestamp}
        yes_supply: ${yes_supply}
        no_supply: ${no_supply}
        max_supply: ${max_supply}
        fees: ${accumulated_fees}
        creator: ${creator_pubkey}

  # 2. BTC Change Output: Returning creator's gas remainder
  - address: ${addr_creator}
    value: ${creator_btc_change}
