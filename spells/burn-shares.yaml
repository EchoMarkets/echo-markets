# =============================================================================
# BURN SHARES SPELL
# =============================================================================
# Burns equal amounts of YES and NO tokens to recover collateral
#
# This allows users to exit their position before market resolution
# by returning complete sets (1 YES + 1 NO) for collateral.
#
# Requirements:
# - Market must be Active
# - Current timestamp must be before trading_deadline
# - Must burn equal amounts of YES and NO tokens
#
# Usage:
#   export current_timestamp=$(date +%s)
#   export burn_amount=100000  # number of complete sets to burn
# 1. Identity Derivation (Byte-safe token IDs)
#   export yes_token_id=$(echo -n "${market_id}01" | xxd -r -p | sha256sum | cut -d' ' -f1)
#   export no_token_id=$(echo -n "${market_id}02" | xxd -r -p | sha256sum | cut -d' ' -f1)
# 2. Supply Calculations
#   export new_yes_supply=$((old_yes_supply - burn_amount))
#   export new_no_supply=$((old_no_supply - burn_amount))
# 3. Financial Calculations (Sats)
#   export new_market_balance=$((old_market_balance - burn_amount))
#   export user_btc_change=$((user_btc_input_val - 500)) # 500 sats for tx fees
# 4. Standard Spell Execution
#   cat burn-shares.yaml | envsubst | charms spell check --app-bins=${app_bin}
# =============================================================================

version: 8

apps:
  $00: n/${market_id}/${app_vk}
  $01: t/${yes_token_id}/${app_vk}
  $02: t/${no_token_id}/${app_vk}

public_inputs:
  $00:
    Burn:
      set_count: ${burn_amount}
      current_timestamp: ${current_timestamp}

ins:
  # 1. Market NFT (Source of collateral)
  - utxo_id: ${market_utxo_id}
    charms:
      $00:
        market_id: ${market_id}
        question_hash: ${question_hash}
        params:
          trading_deadline: ${trading_deadline}
          resolution_deadline: ${resolution_deadline}
          fee_bps: ${fee_bps}
          min_bet: ${min_bet}
        status: Active
        resolution: null
        yes_supply: ${old_yes_supply}
        no_supply: ${old_no_supply}
        max_supply: ${max_supply}
        fees: ${accumulated_fees}
        creator: ${creator_pubkey}

  # 2. User's YES tokens to burn
  - utxo_id: ${user_yes_utxo}
    charms:
      $01: ${burn_amount}

  # 3. User's NO tokens to burn
  - utxo_id: ${user_no_utxo}
    charms:
      $02: ${burn_amount}

  # 4. User's BTC UTXO (To pay for transaction fees/gas)
  - utxo_id: ${user_btc_utxo}
    charms: {}

outs:
  # 1. Updated Market NFT: Reduced supply and reduced BTC balance
  - address: ${addr_market}
    value: ${new_market_balance}
    charms:
      $00:
        market_id: ${market_id}
        question_hash: ${question_hash}
        params:
          trading_deadline: ${trading_deadline}
          resolution_deadline: ${resolution_deadline}
          fee_bps: ${fee_bps}
          min_bet: ${min_bet}
        status: Active
        resolution: null
        yes_supply: ${new_yes_supply}
        no_supply: ${new_no_supply}
        max_supply: ${max_supply}
        fees: ${accumulated_fees}
        creator: ${creator_pubkey}

  # 2. User receives BTC collateral back
  - address: ${addr_user}
    value: ${burn_amount}

  # 3. BTC Change Output: Returning user's gas remainder
  - address: ${addr_user}
    value: ${user_btc_change}
