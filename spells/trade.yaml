# =============================================================================
# TRADE SPELL (P2P Swap)
# =============================================================================
# Direct peer-to-peer swap of YES for NO tokens (or vice versa)
#
# This is a SIMPLE TRANSFER - no app contract proof required!
# Charms automatically validates fungible token conservation.
#
# The market NFT is NOT needed for trades - this is just a token swap
# that relies on Charms' built-in conservation validation.
#
# Example: Alice has YES, Bob has NO, they want to swap
# - Alice inputs YES tokens, receives NO tokens
# - Bob inputs NO tokens, receives YES tokens
#
# Usage:
# 1. Derive Token IDs from raw Market ID bytes + Discriminator byte
# Assuming 01 for YES and 02 for NO as established in previous work
#   export yes_token_id=$(echo -n "${market_id}01" | xxd -r -p | sha256sum | cut -d' ' -f1)
#   export no_token_id=$(echo -n "${market_id}02" | xxd -r -p | sha256sum | cut -d' ' -f1)
# 2. Calculate BTC Change
# Alice provides a 10,000 sat UTXO, transaction fee is 500 sats
#   export alice_btc_input_value=10000
#   export tx_fee=500
#   export alice_btc_change=$((alice_btc_input_val - tx_fee))
# 3. Standard Spell Execution
#   cat trade.yaml | envsubst | charms spell check --app-bins=${app_bin}
# =============================================================================

version: 8

apps:
  $01: t/${yes_token_id}/${app_vk}
  $02: t/${no_token_id}/${app_vk}

ins:
  # 1. Alice's YES tokens
  - utxo_id: ${alice_yes_utxo}
    charms:
      $01: ${trade_amount}

  # 2. Bob's NO tokens
  - utxo_id: ${bob_no_utxo}
    charms:
      $02: ${trade_amount}

  # 3. Alice's BTC UTXO (To pay for gas/fees)
  - utxo_id: ${alice_btc_utxo}
    charms: {}

outs:
  # 1. Alice receives NO tokens
  - address: ${addr_alice}
    charms:
      $02: ${trade_amount}

  # 2. Bob receives YES tokens
  - address: ${addr_bob}
    charms:
      $01: ${trade_amount}

  # 3. BTC Change Output (Returning Alice's remaining BTC)
  - address: ${addr_alice}
    value: ${alice_btc_change}
